AWSTemplateFormatVersion: '2010-09-09'

Description: |
  Root CloudFormation template for AI-Powered Cloud Learning Assistant using Gemini API. Creates:
  - S3 bucket for tutor content storage
  - DynamoDB Sessions table with event streams and point-in-time recovery
  - CloudWatch Logs log group for the Lambda function
  - IAM execution role for the Lambda function
  - AI Cloud Tutor Lambda function
  - S3 invoke permission that lets the bucket trigger the Lambda function

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Nested Stack Configuration"
        Parameters:
          - NestedStacksS3BucketName
      - Label:
          default: "Misc Configuration"
        Parameters:
          - Environment
          - CiSuffix
      - Label:
          default: "KMS Encryption"
        Parameters:
          - KmsKey
          - CWLogGroupKmsKey
      - Label:
          default: "S3 Bucket Configuration"
        Parameters:
          - ProjectName
          - BucketBaseName
          - EnableBucketKey
      - Label:
          default: "DynamoDB Table Configuration"
        Parameters:
          - TableBaseName
          - BillingMode
          - EnablePointInTimeRecovery
      - Label:
          default: "Lambda IAM Role Configuration"
        Parameters:
          - LambdaBaseName
          - LambdaRoleBaseName

    ParameterLabels:
      NestedStacksS3BucketName:
        default: "S3 Bucket Name"
      KmsKey:
        default: "KMS Key (ARN / Alias)"
      Environment:
        default: "Environment"
      CiSuffix:
        default: "CI Suffix"
      CWLogGroupKmsKey:
        default: "CloudWatch Log Group KMS Key (ARN / Alias)"
      ProjectName:
        default: "Project Name"
      BucketBaseName:
        default: "Bucket Base Name"
      EnableBucketKey:
        default: "Enable S3 Bucket Key"
      TableBaseName:
        default: "Sessions Table Base Name"
      BillingMode:
        default: "Billing Mode"
      EnablePointInTimeRecovery:
        default: "Enable Point-in-Time Recovery"
      LambdaBaseName:
        default: "Lambda Function Base Name"
      LambdaRoleBaseName:
        default: "Lambda Execution Role Name"

Parameters:
  NestedStacksS3BucketName:
    Type: String
    Default: "subhamay-cfn-templates-bucket-270453428528-us-east-1"
    Description: "S3 bucket name where the nested CloudFormation template is stored"
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: "S3 bucket name must be 3-63 characters, start and end with lowercase letter or number, and can contain hyphens and dots"

  ProjectName:
    Type: String
    Default: "proj-ztc"
    Description: "Project name to use as a bucket prefix"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  BucketBaseName:
    Type: String
    Default: "ai-cloud-tutor"
    MinLength: 1
    MaxLength: 30
    AllowedPattern: "^[a-z0-9.-]+$"
    ConstraintDescription: "Bucket base name must be 1-30 characters and can only contain lowercase letters, numbers, hyphens, and dots"
    Description: Base name for the S3 bucket (account ID, environment, and region will be appended)

  KmsKey:
    Type: String
    Default: "SB-KMS"
    AllowedPattern: "^(alias/[a-zA-Z0-9_-]+|arn:aws:kms:[a-z0-9-]+:[0-9]+:key/[a-zA-Z0-9-]+|[a-zA-Z0-9_-]+)?$"
    ConstraintDescription: "KMS Key can be a key name (e.g., my-key, auto-converted to alias/my-key), a KMS key alias (e.g., alias/my-key), or a full KMS key ARN (e.g., arn:aws:kms:region:account:key/key-id), or leave empty for no KMS encryption"
    Description: "Optional KMS Key for S3 bucket encryption. Accepts: key name (my-key), alias (alias/my-key), or ARN (arn:aws:kms:region:account:key/key-id). Plain key names are auto-converted to aliases."

  CWLogGroupKmsKey:
    Type: String
    Default: "arn:aws:kms:us-east-1:269235677084:key/e691f177-0403-4b15-b9a7-50b57b204140"
    AllowedPattern: "^(alias/[a-zA-Z0-9_-]+|arn:aws:kms:[a-z0-9-]+:[0-9]+:key/[a-zA-Z0-9-]+|[a-zA-Z0-9_-]+)?$"
    ConstraintDescription: "KMS Key can be a key name (e.g., my-key, auto-converted to alias/my-key), a KMS key alias (e.g., alias/my-key), or a full KMS key ARN (e.g., arn:aws:kms:region:account:key/key-id), or leave empty for no KMS encryption"
    Description: "Optional KMS Key for CloudWatch Logs encryption. Accepts: key name (my-key), alias (alias/my-key), or ARN (arn:aws:kms:region:account:key/key-id). Leave empty to use default encryption."

  EnableBucketKey:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable S3 Bucket Key for KMS encryption cost optimization (only applicable when KmsKey is provided)"

  Environment:
    Type: String
    Default: devl
    Description: "Deployment environment for the S3 bucket"

  TableBaseName:
    Type: String
    Default: "ai-cloud-tutor"
    MinLength: 1
    MaxLength: 30
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Table base name must be 1-30 characters, lowercase letters, numbers, and hyphens only"
    Description: "Base name for the DynamoDB table (account ID, environment, and region will be appended)"

  BillingMode:
    Type: String
    Default: "PROVISIONED"
    AllowedValues:
      - "PAY_PER_REQUEST"
      - "PROVISIONED"
    Description: "DynamoDB billing mode (PAY_PER_REQUEST for on-demand, PROVISIONED for fixed capacity)"

  EnablePointInTimeRecovery:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable point-in-time recovery for the DynamoDB table"

  LambdaBaseName:
    Type: String
    Default: "ai-cloud-tutor-lambda"
    MinLength: 1
    MaxLength: 30
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lambda base name must be 1-30 characters and contain only lowercase letters, numbers, and hyphens"
    Description: "Base name for the Lambda function (project name, base name, environment, and region will be combined)"

  LambdaRoleBaseName:
    Type: String
    Default: "ai-cloud-tutor-lambda-role"
    MinLength: 1
    MaxLength: 64
    AllowedPattern: "^[a-zA-Z0-9-]+$"
    ConstraintDescription: "Lambda role base name must be 1-64 characters and contain only alphanumeric characters and hyphens"
    Description: "Base name of the IAM role for Lambda function execution"

  CiSuffix:
    Type: String
    Default: ""
    Description: "Optional CI suffix to append to the bucket name"

Conditions:
  HasKmsKey: !Not [!Equals [!Ref KmsKey, ""]]
  HasCWLogGroupKmsKey: !Not [!Equals [!Ref CWLogGroupKmsKey, ""]]
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]

Resources:
  ContentS3BucketNestedStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested S3 bucket CloudFormation template to create a versioned, encrypted S3 bucket with public access blocking and optional logging/website configuration"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to assume the required IAM role for S3 and KMS operations"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-s3-bucket/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        BucketBaseName: !Ref BucketBaseName
        KmsKey: !Ref KmsKey
        EnableBucketKey: !Ref EnableBucketKey
        Environment: !Ref Environment
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: ManagedBy
          Value: RootStack
        - Key: NestedStackPurpose
          Value: S3BucketCreation

  SessionsDynamoDBNestedStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested DynamoDB CloudFormation template to create a Sessions table with event streams, encryption, and PITR enabled for event-driven tutor session processing"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create DynamoDB tables, streams, and KMS resources"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-dynamodb-table/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        TableBaseName: !Ref TableBaseName
        Environment: !Ref Environment
        BillingMode: !Ref BillingMode
        PartitionKeyName: "questionId"
        PartitionKeyType: "S"
        EnablePointInTimeRecovery: !Ref EnablePointInTimeRecovery
        KmsKey: !If [HasKmsKey, !Ref KmsKey, ""]
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: AiCloudTutorSessionsDatabase
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  LambdaCWLogGroupNestedStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested CloudWatch Logs CloudFormation template to create a log group for Lambda functions"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create CloudWatch Logs resources"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-cloudwatch-log-group/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        CustomLogGroupName: !If
          - HasCiSuffix
          - !Sub "/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
          - !Sub "/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}"
        RetentionInDays: 14
        KmsKeyIdOrAlias: !If [HasCWLogGroupKmsKey, !Ref CWLogGroupKmsKey, ""]
        Environment: !Ref Environment
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: LambdaLogGroup
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  LambdaIAMRoleNestedStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested IAM role CloudFormation template to create an execution role for Lambda functions with permissions for S3, DynamoDB, and CloudWatch Logs"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create IAM roles and inline policies"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-iam-roles-policies/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        RoleName: !Ref LambdaRoleBaseName
        Environment: !Ref Environment
        AssumeRolePrincipal: "lambda.amazonaws.com"
        EnableLambdaBasicExecutionPolicy: "true"
        EnableS3ReadWritePolicy: "true"
        EnableDynamoDBReadWritePolicy: "true"
        EnableKMSPolicy: "true"
        DynamoDBTableArn: !GetAtt SessionsDynamoDBNestedStack.Outputs.TableArn
        S3BucketArn: !GetAtt ContentS3BucketNestedStack.Outputs.S3BucketArn
        LambdaBasicExecutionLogGroupArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}:*"
        CiSuffix: !Ref CiSuffix

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: LambdaExecutionRole
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  LambdaFunctionNestedStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn:
      - LambdaCWLogGroupNestedStack
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested Lambda function CloudFormation template to create the AI Cloud Tutor Lambda function using the IAM execution role, log group, and DynamoDB table created by the other nested stacks"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create Lambda functions"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-lambda-function/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        LambdaFunctionBaseName: !Ref LambdaBaseName
        Environment: !Ref Environment
        Runtime: "python3.12"
        Handler: "index.lambda_handler"
        MemorySize: "256"
        Timeout: "60"
        IAMRoleArn: !GetAtt LambdaIAMRoleNestedStack.Outputs.RoleArn
        LambdaLogGroup: !Sub "/aws/lambda/${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}"
        DynamoDBTableName: !GetAtt SessionsDynamoDBNestedStack.Outputs.TableName
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: LambdaFunction
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt LambdaFunctionNestedStack.Outputs.FunctionArn
      Principal: s3.amazonaws.com
      # Built from the name, not !GetAtt of the bucket, to avoid a circular dependency
      SourceArn: !GetAtt ContentS3BucketNestedStack.Outputs.S3BucketArn
      SourceAccount: !Ref AWS::AccountId

Outputs:
  NestedStackId:
    Description: "ID of the nested stack"
    Value: !Ref ContentS3BucketNestedStack

  S3BucketName:
    Description: "Name of the S3 bucket created by the nested stack"
    Value: !GetAtt ContentS3BucketNestedStack.Outputs.S3BucketName

  S3BucketArn:
    Description: "ARN of the S3 bucket created by the nested stack"
    Value: !GetAtt ContentS3BucketNestedStack.Outputs.S3BucketArn

  NestedStackOutputs:
    Description: "All outputs from the nested stack"
    Value: !Sub |
      BucketName: ${ContentS3BucketNestedStack.Outputs.S3BucketName}
      BucketArn: ${ContentS3BucketNestedStack.Outputs.S3BucketArn}

  SessionsDynamoDBTableName:
    Description: "Name of the DynamoDB table created by the nested stack"
    Value: !GetAtt SessionsDynamoDBNestedStack.Outputs.TableName

  SessionsDynamoDBTableArn:
    Description: "ARN of the DynamoDB table created by the nested stack"
    Value: !GetAtt SessionsDynamoDBNestedStack.Outputs.TableArn

  LambdaExecutionRoleArn:
    Description: "ARN of the Lambda execution role created by the nested stack"
    Value: !GetAtt LambdaIAMRoleNestedStack.Outputs.RoleArn

  LambdaExecutionRoleName:
    Description: "Name of the Lambda execution role created by the nested stack"
    Value: !GetAtt LambdaIAMRoleNestedStack.Outputs.RoleName
  
  LambdaFunctionArn:
    Description: "ARN of the Lambda function created by the nested stack"
    Value: !GetAtt LambdaFunctionNestedStack.Outputs.FunctionArn

  ComputedLambdaFunctionName:
    Description: "Computed Lambda function name using project name, base name, environment, and region"
    Value: !Sub "${ProjectName}-${LambdaBaseName}-${Environment}-${AWS::Region}"